name: Build Paclet

# Builds the .paclet artifact with no Wolfram Cloud dependency: the kernel is
# licensed through an on-demand entitlement, MarkdownToNotebook is fetched as a
# plain .wl from its GitHub repository, and nothing in the build connects to
# the cloud. The test job runs the suite beside the build without gating the
# artifact on it.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mtn_ref:
        description: MarkdownToNotebook git ref to fetch the .wl from
        required: false
        default: main

concurrency:
  group: build-paclet-${{ github.ref }}
  cancel-in-progress: true

env:
  WOLFRAMSCRIPT_ENTITLEMENTID: ${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID }}

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: wolframresearch/wolframengine:latest
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run the suite
        run: wolframscript -f Tests/RunTests.wls

  build:
    name: Build Paclet
    # Serialized behind the suite deliberately: an on-demand entitlement admits
    # one kernel launch at a time, so a build that starts while the suite's
    # kernel is still running is refused the license with "No valid password
    # found" before it reaches any build step.
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: wolframresearch/wolframengine:latest
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install front-end libraries
        # MarkdownToNotebook parses box structures, evaluates example cells and
        # rasterizes graphical outputs through UsingFrontEnd; the engine ships
        # the front end binary, and these are the shared libraries it links.
        #
        # ca-certificates is deliberately NOT installed or upgraded here. The
        # image carries its own trust store, and letting apt replace it rewrites
        # /etc/ssl/certs ("14 added, 39 removed"), after which the kernel cannot
        # reach the licensing server and dies with "No valid password found"
        # before any of this repository's code runs.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            fontconfig \
            libgl1 libglu1-mesa libxi6 libxrandr2 libxtst6 \
            libxcursor1 libxext6 libxrender1 libxfixes3

      - name: Build documentation notebooks
        # build_docs.wls fetches MarkdownToNotebook from GitHub itself, so this
        # is the same command a developer runs and there is no second fetch
        # path that only CI exercises.
        env:
          MTN_REF: ${{ inputs.mtn_ref || 'main' }}
        run: wolframscript -f build_docs.wls

      - name: Build the paclet archive
        run: wolframscript -f build_paclet.wls

      - name: Upload the .paclet artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wolfram__Arrays-paclet
          path: build/*.paclet
          if-no-files-found: error

  release:
    name: Release
    # A tag publishes whatever the build just produced, so the archive attached
    # to a release is the same file the workflow tested and uploaded rather
    # than one rebuilt separately.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the .paclet artifact
        uses: actions/download-artifact@v4
        with:
          name: Wolfram__Arrays-paclet
          path: dist

      - name: Check the archive version against the tag
        # A release tagged for one version carrying an archive built from
        # another is the one mistake this job can make silently, so the file
        # name has to agree with the tag before anything is published.
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          archive=$(ls dist/*.paclet)
          echo "tag version:     $tag"
          echo "archive:         $archive"
          case "$(basename "$archive")" in
            "Wolfram__Arrays-$tag.paclet") echo "version matches" ;;
            *) echo "::error::archive $(basename "$archive") does not match tag v$tag"; exit 1 ;;
          esac

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.paclet \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
