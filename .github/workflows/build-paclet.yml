name: Build Paclet

# Builds the .paclet artifact with PacletPage and no Wolfram Cloud dependency:
# the kernel is licensed through an on-demand entitlement, pacletpage.wl fetches
# PacletPage and MarkdownToNotebook from their GitHub repositories, and nothing
# in the build connects to the cloud. The build runs behind the test suite.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mtn_ref:
        description: MarkdownToNotebook git ref to fetch the .wl from
        required: false
        default: main
      pacletpage_ref:
        description: PacletPage git ref to fetch, by default the tag pacletpage.wl pins
        required: false
        default: ''

concurrency:
  group: build-paclet-${{ github.ref }}
  cancel-in-progress: true

env:
  WOLFRAMSCRIPT_ENTITLEMENTID: ${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID }}

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: wolframresearch/wolframengine:latest
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run the suite
        run: wolframscript -f Tests/RunTests.wls

  build:
    name: Build Paclet
    # Serialized behind the suite deliberately: an on-demand entitlement admits
    # one kernel launch at a time, so a build that starts while the suite's
    # kernel is still running is refused the license with "No valid password
    # found" before it reaches any build step.
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: wolframresearch/wolframengine:latest
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install front-end libraries
        # MarkdownToNotebook parses box structures, evaluates example cells and
        # rasterizes graphical outputs through UsingFrontEnd; the engine ships
        # the front end binary, and these are the shared libraries it links.
        #
        # ca-certificates is deliberately NOT installed or upgraded here. The
        # image carries its own trust store, and letting apt replace it rewrites
        # /etc/ssl/certs ("14 added, 39 removed"), after which the kernel cannot
        # reach the licensing server and dies with "No valid password found"
        # before any of this repository's code runs.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            fontconfig \
            libgl1 libglu1-mesa libxi6 libxrandr2 libxtst6 \
            libxcursor1 libxext6 libxrender1 libxfixes3

      - name: License the kernels PacletPage starts
        # wolframscript licenses the kernel it starts by passing it
        # -pwfile !cloudlm.wolfram.com, which sends it to the cloud license
        # manager, and -entitlement with WOLFRAMSCRIPT_ENTITLEMENTID.
        # PacletPage starts kernels of its own - the definition scan, the
        # archive build, the load check - by running Executables/WolframKernel
        # directly, and a kernel started so gets no license and stops with "No
        # valid password found". The launcher is wrapped so that a kernel
        # started without an entitlement is given the job's, and one started
        # with one is left as it is.
        run: |
          set -eu
          kernels=$(find /usr/local /opt -path '*/Executables/WolframKernel' 2>/dev/null || true)
          if [ "$(printf '%s\n' "$kernels" | grep -c .)" -ne 1 ]; then
            echo "::error::expected one kernel launcher, found: $kernels"; exit 1
          fi
          kernel="$kernels"
          mv "$kernel" "$kernel.unlicensed"
          cat > "$kernel" <<'LAUNCHER'
          #!/bin/sh
          for argument in "$@"; do
            if [ "$argument" = "-entitlement" ]; then exec "$0.unlicensed" "$@"; fi
          done
          exec "$0.unlicensed" -pwfile '!cloudlm.wolfram.com' -entitlement "$WOLFRAMSCRIPT_ENTITLEMENTID" "$@"
          LAUNCHER
          chmod +x "$kernel"
          echo "wrapped $kernel"

      - name: Build documentation notebooks
        # build.wls fetches PacletPage and MarkdownToNotebook from GitHub
        # itself, so this is the same command a developer runs and there is no
        # second fetch path that only CI exercises.
        env:
          MTN_REF: ${{ inputs.mtn_ref || 'main' }}
          PACLETPAGE_REF: ${{ inputs.pacletpage_ref }}
        run: wolframscript -f build.wls

      - name: Build the paclet archive
        # A dry run with no cloud connection builds the archive into
        # Arrays/build and checks that it holds every documentation page and
        # loads alone in a fresh kernel, which is the archive a submission
        # would send.
        env:
          MTN_REF: ${{ inputs.mtn_ref || 'main' }}
          PACLETPAGE_REF: ${{ inputs.pacletpage_ref }}
        run: wolframscript -f submit.wls --dry-run

      - name: Upload the .paclet artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wolfram__Arrays-paclet
          path: Arrays/build/*.paclet
          if-no-files-found: error

  release:
    name: Release
    # A tag publishes whatever the build just produced, so the archive attached
    # to a release is the same file the workflow tested and uploaded rather
    # than one rebuilt separately.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the .paclet artifact
        uses: actions/download-artifact@v4
        with:
          name: Wolfram__Arrays-paclet
          path: dist

      - name: Check the archive version against the tag
        # A release tagged for one version carrying an archive built from
        # another is the one mistake this job can make silently, so the file
        # name has to agree with the tag before anything is published.
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          archive=$(ls dist/*.paclet)
          echo "tag version:     $tag"
          echo "archive:         $archive"
          case "$(basename "$archive")" in
            "Wolfram__Arrays-$tag.paclet") echo "version matches" ;;
            *) echo "::error::archive $(basename "$archive") does not match tag v$tag"; exit 1 ;;
          esac

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.paclet \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
